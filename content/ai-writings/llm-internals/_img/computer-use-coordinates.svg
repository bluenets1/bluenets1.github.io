<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
  <title id="title">Resizing screenshots and mapping clicks</title>
  <desc id="desc">A full screen is resized to a smaller image for the model. A model coordinate is divided by the resize scale to map it back to the original display. A zoom crop gives a closer view.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#44666a"/></marker></defs>
  <rect width="900" height="310" rx="18" fill="#f4f3ee"/>
  <g font-family="system-ui, sans-serif">
    <rect x="42" y="47" width="320" height="194" rx="10" fill="#fff" stroke="#9eaaa5" stroke-width="2"/>
    <rect x="42" y="47" width="320" height="25" rx="10" fill="#e4efec"/><circle cx="59" cy="60" r="4" fill="#93aaa3"/><circle cx="74" cy="60" r="4" fill="#93aaa3"/>
    <rect x="93" y="117" width="196" height="45" rx="5" fill="#f5f1e8" stroke="#d0cec5"/><text x="169" y="144" text-anchor="middle" font-size="15" fill="#596567">target button</text>
    <circle cx="242" cy="142" r="9" fill="#d26d45" stroke="#fff" stroke-width="3"/>
    <text x="202" y="269" text-anchor="middle" font-size="13" fill="#596567">1920 × 1080 display</text>
    <path d="M388 143h75" stroke="#44666a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="425" y="126" text-anchor="middle" font-size="13" fill="#596567">resize</text>
    <rect x="501" y="77" width="220" height="134" rx="9" fill="#fff" stroke="#9eaaa5" stroke-width="2"/>
    <rect x="501" y="77" width="220" height="21" rx="9" fill="#e4efec"/><rect x="535" y="126" width="145" height="32" rx="5" fill="#f5f1e8" stroke="#d0cec5"/><text x="568" y="147" text-anchor="middle" font-size="13" fill="#596567">target button</text><circle cx="639" cy="145" r="7" fill="#d26d45" stroke="#fff" stroke-width="2"/>
    <text x="611" y="238" text-anchor="middle" font-size="13" fill="#596567">1280 × 720 image</text>
    <text x="611" y="258" text-anchor="middle" font-size="13" fill="#263536">model points at (800, 300)</text>
    <path d="M721 143h55" stroke="#44666a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="748" y="112" text-anchor="middle" font-size="12" fill="#596567">× 1.5</text>
    <rect x="790" y="89" width="84" height="105" rx="8" fill="#fff1d9" stroke="#dfc99d"/><text x="832" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#263536">click</text><text x="832" y="149" text-anchor="middle" font-size="12" fill="#596567">(1200, 450)</text><text x="832" y="169" text-anchor="middle" font-size="11" fill="#596567">full display</text>
    <text x="449" y="294" text-anchor="middle" font-size="13" fill="#596567">A crop or Retina pixel ratio adds an offset or another scale to the mapping.</text>
  </g>
</svg>
